[project]
name = "opensre-teams-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "opensre-im-core",
  "microsoft-teams-apps>=2.0.14",
  "microsoft-teams-cards>=2.0.14",
  "aiohttp>=3.9.0",
  "python-dotenv>=1.0.0",
  "mistune>=3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

# The shared IM core lives next to this package in the monorepo; an editable
# path source keeps a single copy of the code (and needs no PyPI release).
[tool.uv.sources]
opensre-im-core = { path = "../im-core", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
