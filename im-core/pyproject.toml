[project]
name = "opensre-im-core"
version = "0.1.0"
description = "Platform-agnostic IM core for OpenSRE chat integrations (Teams, Feishu, ...)"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9.0",
  "mistune>=3.0.0",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opensre_im_core"]
